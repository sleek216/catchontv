<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 48" width="380" height="48">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- VISA -->
  <g transform="translate(5, 4)" filter="url(#shadow)">
    <rect width="64" height="40" rx="6" fill="#ffffff"/>
    <rect width="64" height="40" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="900" font-style="italic" fill="#1434CB" text-anchor="middle" letter-spacing="1">VISA</text>
  </g>

  <!-- MASTERCARD -->
  <g transform="translate(80, 4)" filter="url(#shadow)">
    <rect width="64" height="40" rx="6" fill="#ffffff"/>
    <rect width="64" height="40" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="26" cy="20" r="12" fill="#EB001B"/>
    <circle cx="38" cy="20" r="12" fill="#F79E1B" fill-opacity="0.9"/>
  </g>

  <!-- AMEX -->
  <g transform="translate(155, 4)" filter="url(#shadow)">
    <rect width="64" height="40" rx="6" fill="#006FCF"/>
    <rect width="64" height="40" rx="6" fill="none" stroke="#0058a3" stroke-width="1"/>
    <text x="32" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">AMEX</text>
  </g>

  <!-- DISCOVER -->
  <g transform="translate(230, 4)" filter="url(#shadow)">
    <rect width="64" height="40" rx="6" fill="#ffffff"/>
    <rect width="64" height="40" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="900" fill="#1f2937" text-anchor="middle">DISC</text>
    <circle cx="40" cy="20" r="5" fill="#FF6000"/>
    <text x="51" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" font-weight="900" fill="#1f2937" text-anchor="middle">VER</text>
  </g>

  <!-- PAYPAL -->
  <g transform="translate(305, 4)" filter="url(#shadow)">
    <rect width="64" height="40" rx="6" fill="#ffffff"/>
    <rect width="64" height="40" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <text x="32" y="25" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" font-style="italic" fill="#003087" text-anchor="middle">Pay<tspan fill="#0079C1">Pal</tspan></text>
  </g>
</svg>
